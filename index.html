<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker Pro</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0f0f0f;
        --bg2: #181818;
        --bg3: #222222;
        --border: rgba(255, 255, 255, 0.08);
        --border2: rgba(255, 255, 255, 0.14);
        --text: #f0ede6;
        --muted: #888;
        --accent: #c8f07a;
        --accent-dark: #8db84a;
        --accent-dim: rgba(200, 240, 122, 0.12);
        --gold: #f0c060;
        --gold-dim: rgba(240, 192, 96, 0.13);
        --radius: 14px;
        --radius-sm: 8px;
        --font-display: "Playfair Display", serif;
        --font-body: "Plus Jakarta Sans", sans-serif;
      }

      [data-theme="light"] {
        --bg: #f7f5f0;
        --bg2: #ffffff;
        --bg3: #edeae3;
        --border: rgba(0, 0, 0, 0.08);
        --border2: rgba(0, 0, 0, 0.14);
        --text: #1a1a1a;
        --muted: #777;
        --accent: #4a8a1e;
        --accent-dark: #2d5c10;
        --accent-dim: rgba(74, 138, 30, 0.1);
        --gold: #b07a10;
        --gold-dim: rgba(176, 122, 16, 0.1);
      }

      body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        transition:
          background 0.3s,
          color 0.3s;
      }

      /* ── Layout ── */
      .shell {
        max-width: 820px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      /* ── Top bar ── */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2.5rem;
      }
      .logo {
        font-family: var(--font-display);
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      .logo span {
        color: var(--accent);
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-btn {
        background: var(--bg3);
        border: 0.5px solid var(--border2);
        border-radius: var(--radius-sm);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text);
        font-size: 16px;
        transition: background 0.15s;
      }
      .icon-btn:hover {
        background: var(--border2);
      }

      /* ── Quote banner ── */
      .quote-banner {
        background: var(--bg2);
        border: 0.5px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: var(--radius);
        padding: 1rem 1.25rem;
        margin-bottom: 2rem;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .quote-icon {
        font-size: 20px;
        margin-top: 2px;
        flex-shrink: 0;
      }
      .quote-text {
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.6;
        flex: 1;
        font-style: italic;
      }
      .quote-text strong {
        color: var(--text);
        font-style: normal;
        font-size: 13px;
        display: block;
        margin-top: 4px;
      }
      .quote-refresh {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        font-size: 15px;
        padding: 2px;
        flex-shrink: 0;
        transition: color 0.15s;
      }
      .quote-refresh:hover {
        color: var(--accent);
      }

      /* ── Stats ── */
      .stats-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 2rem;
      }
      .stat {
        background: var(--bg2);
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
      }
      .stat-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .stat-value {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 600;
        line-height: 1;
      }
      .stat-value.green {
        color: var(--accent);
      }
      .stat-value.gold {
        color: var(--gold);
      }

      /* ── Month nav ── */
      .month-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.25rem;
      }
      .month-label {
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 600;
      }
      .month-nav {
        display: flex;
        gap: 6px;
      }
      .nav-btn {
        background: var(--bg2);
        border: 0.5px solid var(--border2);
        border-radius: var(--radius-sm);
        width: 32px;
        height: 32px;
        cursor: pointer;
        color: var(--text);
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }
      .nav-btn:hover {
        background: var(--bg3);
      }
      .add-btn {
        background: var(--accent);
        color: #0f0f0f;
        border: none;
        border-radius: var(--radius-sm);
        padding: 7px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-body);
        transition: opacity 0.15s;
      }
      .add-btn:hover {
        opacity: 0.88;
      }

      /* ── Habit cards ── */
      .habits-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .habit-card {
        background: var(--bg2);
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px;
        animation: fadeUp 0.28s ease both;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .habit-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .h-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        flex-shrink: 0;
      }
      .h-info {
        flex: 1;
      }
      .h-name {
        font-size: 14px;
        font-weight: 600;
      }
      .h-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .h-actions {
        display: flex;
        gap: 4px;
      }
      .h-del {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        font-size: 15px;
        padding: 4px;
        border-radius: 6px;
        transition:
          color 0.12s,
          background 0.12s;
      }
      .h-del:hover {
        color: #e05a5a;
        background: rgba(224, 90, 90, 0.1);
      }

      /* ── Calendar ── */
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
      }
      .cal-day-label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
        text-align: center;
        padding-bottom: 4px;
      }
      .cal-cell {
        aspect-ratio: 1;
        border-radius: 5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 500;
        color: var(--muted);
        background: var(--bg3);
        border: 0.5px solid transparent;
        transition:
          transform 0.1s,
          background 0.15s;
        position: relative;
      }
      .cal-cell:not(.future):hover {
        transform: scale(1.12);
        border-color: var(--border2);
      }
      .cal-cell.done {
        color: #0f0f0f;
        font-weight: 600;
      }
      .cal-cell.today {
        box-shadow: 0 0 0 1.5px var(--text);
      }
      .cal-cell.future {
        opacity: 0.28;
        cursor: default;
        pointer-events: none;
      }
      .cal-cell.done::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: rgba(0, 0, 0, 0.08);
      }

      /* ── Progress bar ── */
      .prog-wrap {
        height: 3px;
        background: var(--bg3);
        border-radius: 99px;
        margin-top: 12px;
      }
      .prog-bar {
        height: 100%;
        border-radius: 99px;
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ── Empty state ── */
      .empty {
        text-align: center;
        padding: 3rem 1rem;
        border: 1px dashed var(--border2);
        border-radius: var(--radius);
        color: var(--muted);
        font-size: 14px;
      }
      .empty-icon {
        font-size: 36px;
        margin-bottom: 10px;
      }

      /* ── Modal ── */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 200;
        align-items: center;
        justify-content: center;
      }
      .overlay.open {
        display: flex;
      }
      .modal {
        background: var(--bg2);
        border: 0.5px solid var(--border2);
        border-radius: 18px;
        padding: 1.5rem;
        width: 340px;
        animation: popIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .modal h2 {
        font-family: var(--font-display);
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 1.25rem;
      }
      .field-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--muted);
        margin-bottom: 7px;
        margin-top: 14px;
      }
      .field-label:first-of-type {
        margin-top: 0;
      }
      input[type="text"].m-input {
        width: 100%;
        background: var(--bg3);
        border: 0.5px solid var(--border2);
        border-radius: var(--radius-sm);
        padding: 9px 12px;
        font-size: 14px;
        color: var(--text);
        font-family: var(--font-body);
        outline: none;
      }
      input[type="text"].m-input:focus {
        border-color: var(--accent);
      }
      .emoji-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .e-btn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        border: 0.5px solid var(--border);
        background: var(--bg3);
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.12s;
      }
      .e-btn.sel {
        border-color: var(--accent);
        background: var(--accent-dim);
      }
      .color-grid {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .c-dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
        border: 3px solid transparent;
        outline: 2px solid transparent;
        outline-offset: 2px;
        transition:
          transform 0.15s,
          outline-color 0.15s,
          border-color 0.15s;
        position: relative;
      }
      .c-dot:hover {
        transform: scale(1.1);
      }
      .c-dot.sel {
        border: 3px solid #ffffff;
        outline: 2.5px solid #ffffff;
        outline-offset: 2px;
        transform: scale(1.18);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5);
      }
      [data-theme="light"] .c-dot.sel {
        border-color: #222;
        outline-color: #222;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
      }
      .modal-btns {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 1.25rem;
      }
      .btn-cancel {
        background: var(--bg3);
        border: 0.5px solid var(--border2);
        border-radius: var(--radius-sm);
        padding: 8px 16px;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        font-family: var(--font-body);
      }
      .btn-save {
        background: var(--accent);
        border: none;
        border-radius: var(--radius-sm);
        padding: 8px 20px;
        color: #0f0f0f;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
        font-family: var(--font-body);
      }

      /* ── Print styles — always clean white, works in B&W and Color ── */
      @media print {
        *,
        *::before,
        *::after {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
          box-shadow: none !important;
          text-shadow: none !important;
        }

        /* Hide everything interactive */
        .topbar-right,
        .add-btn,
        .month-nav,
        .h-actions,
        .quote-refresh,
        .overlay,
        .toast,
        .prog-wrap,
        .print-tip {
          display: none !important;
        }

        /* Force white page regardless of screen theme */
        html,
        body {
          background: #ffffff !important;
          color: #111111 !important;
          font-size: 12px !important;
        }

        .shell {
          padding: 0.75rem !important;
          max-width: 100% !important;
        }

        /* Logo */
        .logo {
          color: #111 !important;
          font-size: 20px !important;
        }
        .logo span {
          color: #3a7a1a !important;
        }

        /* Quote banner */
        .quote-banner {
          background: #f8f8f5 !important;
          border: 1px solid #ddd !important;
          border-left: 3px solid #3a7a1a !important;
          color: #444 !important;
          margin-bottom: 1rem !important;
        }
        .quote-text {
          color: #555 !important;
        }

        /* Stats */
        .stats-row {
          gap: 8px !important;
          margin-bottom: 1rem !important;
        }
        .stat {
          background: #f5f5f5 !important;
          border: 1px solid #ddd !important;
          padding: 10px 12px !important;
        }
        .stat-label {
          color: #888 !important;
        }
        .stat-value {
          color: #111 !important;
          font-size: 22px !important;
        }
        .stat-value.green {
          color: #3a7a1a !important;
        }
        .stat-value.gold {
          color: #996600 !important;
        }

        /* Month heading */
        .month-row {
          margin-bottom: 0.75rem !important;
        }
        .month-label {
          color: #111 !important;
          font-size: 17px !important;
        }

        /* Habit cards */
        .habit-card {
          background: #ffffff !important;
          border: 1px solid #ccc !important;
          break-inside: avoid !important;
          page-break-inside: avoid !important;
          margin-bottom: 12px !important;
          padding: 12px 14px !important;
        }

        /* Habit name & sub */
        .h-name {
          color: #111 !important;
        }
        .h-sub {
          color: #777 !important;
        }
        .h-icon {
          border: 1px solid #eee !important;
        }

        /* Calendar day labels */
        .cal-day-label {
          color: #999 !important;
          font-size: 8px !important;
        }

        /* Empty (unchecked) calendar cells */
        .cal-cell {
          background: #f3f3f3 !important;
          color: #bbb !important;
          border: 0.5px solid #ddd !important;
          font-size: 9px !important;
        }

        /* Checked cells — solid colored fill, always visible */
        .cal-cell.done {
          /* JS sets inline background color — we just ensure contrast */
          color: #ffffff !important;
          font-weight: 700 !important;
          border-color: transparent !important;
        }

        /* Today marker */
        .cal-cell.today {
          box-shadow: 0 0 0 1.5px #3a7a1a !important;
        }

        /* Future cells */
        .cal-cell.future {
          background: #fafafa !important;
        }
      }

      /* ── Spinning animation for quote refresh ── */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .spinning {
        animation: spin 0.5s linear;
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%) translateY(60px);
        background: var(--text);
        color: var(--bg);
        border-radius: 99px;
        padding: 8px 20px;
        font-size: 13px;
        font-weight: 500;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 999;
        pointer-events: none;
        white-space: nowrap;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <!-- Top bar -->
      <div class="topbar">
        <div class="logo">Habit<span>Pro</span></div>
        <div class="topbar-right">
          <button
            class="icon-btn"
            id="themeBtn"
            title="Toggle theme"
            onclick="toggleTheme()"
          >
            🌙
          </button>
          <button class="icon-btn" title="Export as PDF" onclick="exportPDF()">
            🖨️
          </button>
        </div>
      </div>

      <!-- Print tip (shown only when printing via beforeprint event) -->
      <div
        id="printTip"
        style="
          display: none;
          background: #fffbe6;
          border: 1px solid #e6b800;
          border-radius: 10px;
          padding: 10px 14px;
          font-size: 13px;
          color: #7a5a00;
          margin-bottom: 1rem;
        "
      >
        💡 <strong>For colored PDF:</strong> Set
        <strong>Color → Color</strong> (not Black &amp; white), and under
        <strong>More settings</strong> enable
        <strong>"Background graphics"</strong>.
      </div>
      <div class="quote-banner" id="quoteBanner">
        <span class="quote-icon">✨</span>
        <div class="quote-text" id="quoteText">
          Loading your daily motivation...
        </div>
        <button
          class="quote-refresh"
          id="quoteRefreshBtn"
          title="New quote"
          onclick="loadQuote(true)"
        >
          ↻
        </button>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat">
          <div class="stat-label">Habits</div>
          <div class="stat-value" id="sHabits">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Best streak</div>
          <div class="stat-value gold" id="sStreak">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Month avg</div>
          <div class="stat-value green" id="sPct">0%</div>
        </div>
        <div class="stat">
          <div class="stat-label">Today done</div>
          <div class="stat-value" id="sToday">0/0</div>
        </div>
      </div>

      <!-- Month row -->
      <div class="month-row">
        <div class="month-label" id="monthLabel"></div>
        <div style="display: flex; gap: 10px; align-items: center">
          <div class="month-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
            <button class="nav-btn" onclick="changeMonth(1)">›</button>
          </div>
          <button class="add-btn" onclick="openModal()">+ Add habit</button>
        </div>
      </div>

      <!-- Habits list -->
      <div class="habits-list" id="habitsList"></div>
    </div>

    <!-- Add habit modal -->
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>New Habit</h2>
        <div class="field-label">Name</div>
        <input
          type="text"
          class="m-input"
          id="mName"
          placeholder="e.g. Morning run"
          maxlength="30"
        />
        <div class="field-label">Icon</div>
        <div class="emoji-grid" id="mEmoji"></div>
        <div class="field-label">Color</div>
        <div class="color-grid" id="mColor"></div>
        <div class="modal-btns">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-save" onclick="saveHabit()">Add</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
      // ── Data ──────────────────────────────────────────────────────────────────
      const EMOJIS = [
        "🏃",
        "💧",
        "📚",
        "🧘",
        "🍎",
        "💪",
        "🌙",
        "✍️",
        "🎯",
        "🎵",
        "🌿",
        "🧠",
        "🛌",
        "🥗",
        "🚴",
        "🧹",
      ];
      const COLORS = [
        "#c8f07a",
        "#60d0f0",
        "#f07a9a",
        "#f0c060",
        "#9a7af0",
        "#60f0b0",
        "#f09060",
        "#a0c0f0",
        "#f0f060",
        "#d090f0",
      ];
      const DAYS = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

      const FALLBACK_QUOTES = [
        {
          text: "Small daily improvements over time lead to stunning results.",
          author: "Robin Sharma",
        },
        {
          text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.",
          author: "Aristotle",
        },
        {
          text: "Motivation is what gets you started. Habit is what keeps you going.",
          author: "Jim Ryun",
        },
        {
          text: "The secret of your future is hidden in your daily routine.",
          author: "Mike Murdock",
        },
        {
          text: "You do not rise to the level of your goals. You fall to the level of your systems.",
          author: "James Clear",
        },
        {
          text: "Consistency is the key to achieving and maintaining momentum.",
          author: "Darren Hardy",
        },
        {
          text: "A year from now you may wish you had started today.",
          author: "Karen Lamb",
        },
        {
          text: "Success is the sum of small efforts repeated day in and day out.",
          author: "Robert Collier",
        },
      ];

      let habits = JSON.parse(localStorage.getItem("htp_habits") || "[]");
      let logs = JSON.parse(localStorage.getItem("htp_logs") || "{}");
      let viewDate = new Date();
      let selEmoji = EMOJIS[0];
      let selColor = COLORS[0];
      let isDark = localStorage.getItem("htp_theme") !== "light";

      function save() {
        localStorage.setItem("htp_habits", JSON.stringify(habits));
        localStorage.setItem("htp_logs", JSON.stringify(logs));
      }

      function dk(y, m, d) {
        return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      }

      // ── Theme ─────────────────────────────────────────────────────────────────
      function applyTheme() {
        const t = isDark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        document.body.setAttribute("data-theme", t);
        document.getElementById("themeBtn").textContent = isDark ? "🌙" : "☀️";
        localStorage.setItem("htp_theme", t);
      }
      function toggleTheme() {
        isDark = !isDark;
        applyTheme();
      }

      // ── Quote ─────────────────────────────────────────────────────────────────
      let quoteIdx = parseInt(localStorage.getItem("htp_qidx") || "0");

      async function loadQuote(force) {
        const todayKey = new Date().toDateString();
        const cached = localStorage.getItem("htp_quote_" + todayKey);
        if (cached && !force) {
          showQuote(JSON.parse(cached));
          return;
        }
        const btn = document.getElementById("quoteRefreshBtn");
        btn.classList.add("spinning");
        try {
          const r = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 120,
              messages: [
                {
                  role: "user",
                  content:
                    'Give me one short motivational quote about habits or consistency. Reply ONLY with JSON: {"text":"quote here","author":"Author Name"}. No markdown, no extra text.',
                },
              ],
            }),
          });
          const data = await r.json();
          const raw = data.content?.[0]?.text?.trim() || "";
          const q = JSON.parse(raw.replace(/```json|```/g, "").trim());
          localStorage.setItem("htp_quote_" + todayKey, JSON.stringify(q));
          showQuote(q);
        } catch {
          const fb = FALLBACK_QUOTES[quoteIdx % FALLBACK_QUOTES.length];
          quoteIdx++;
          localStorage.setItem("htp_qidx", quoteIdx);
          showQuote(fb);
        }
        btn.classList.remove("spinning");
      }

      function showQuote(q) {
        document.getElementById("quoteText").innerHTML =
          `"${q.text}" <strong>— ${q.author}</strong>`;
      }

      // ── Stats ─────────────────────────────────────────────────────────────────
      function calcStreak(hid) {
        const today = new Date();
        let streak = 0;
        for (let i = 0; i < 365; i++) {
          const d = new Date(today);
          d.setDate(d.getDate() - i);
          const k = dk(d.getFullYear(), d.getMonth(), d.getDate());
          if (logs[hid]?.[k]) streak++;
          else if (i > 0) break;
        }
        return streak;
      }
      function calcMonthPct(hid, y, m) {
        const today = new Date();
        const days = new Date(y, m + 1, 0).getDate();
        const limit =
          y === today.getFullYear() && m === today.getMonth()
            ? today.getDate()
            : days;
        let done = 0;
        for (let d = 1; d <= limit; d++) if (logs[hid]?.[dk(y, m, d)]) done++;
        return limit > 0 ? Math.round((done / limit) * 100) : 0;
      }

      // ── Render ────────────────────────────────────────────────────────────────
      function render() {
        const y = viewDate.getFullYear(),
          m = viewDate.getMonth();
        const today = new Date();
        const isCurr = y === today.getFullYear() && m === today.getMonth();
        const days = new Date(y, m + 1, 0).getDate();
        const firstDay = new Date(y, m, 1).getDay();
        const months = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];
        document.getElementById("monthLabel").textContent = months[m] + " " + y;

        // stats
        document.getElementById("sHabits").textContent = habits.length;
        let best = 0;
        habits.forEach((h) => {
          const s = calcStreak(h.id);
          if (s > best) best = s;
        });
        document.getElementById("sStreak").textContent = best;
        const avgPct = habits.length
          ? Math.round(
              habits.reduce((a, h) => a + calcMonthPct(h.id, y, m), 0) /
                habits.length,
            )
          : 0;
        document.getElementById("sPct").textContent = avgPct + "%";
        const todayDone = isCurr
          ? habits.filter((h) => logs[h.id]?.[dk(y, m, today.getDate())]).length
          : 0;
        document.getElementById("sToday").textContent = isCurr
          ? `${todayDone}/${habits.length}`
          : "—";

        // list
        const list = document.getElementById("habitsList");
        if (!habits.length) {
          list.innerHTML = `<div class="empty"><div class="empty-icon">🌱</div>No habits yet — add your first one above!</div>`;
          return;
        }
        list.innerHTML = "";
        habits.forEach((h, i) => {
          const streak = calcStreak(h.id);
          const pct = calcMonthPct(h.id, y, m);
          const card = document.createElement("div");
          card.className = "habit-card";
          card.style.animationDelay = i * 0.04 + "s";

          // head
          const head = document.createElement("div");
          head.className = "habit-head";
          head.innerHTML = `
      <div class="h-icon" style="background:${h.color}22">${h.emoji}</div>
      <div class="h-info">
        <div class="h-name">${h.name}</div>
        <div class="h-sub">${streak > 0 ? "🔥 " + streak + " day streak · " : ""} ${pct}% this month</div>
      </div>
      <div class="h-actions">
        <button class="h-del" title="Delete habit">✕</button>
      </div>`;
          head.querySelector(".h-del").onclick = () => {
            if (confirm('Remove "' + h.name + '"?')) {
              habits = habits.filter((x) => x.id !== h.id);
              delete logs[h.id];
              save();
              render();
            }
          };
          card.appendChild(head);

          // calendar
          const grid = document.createElement("div");
          grid.className = "cal-grid";
          DAYS.forEach((dl) => {
            const lbl = document.createElement("div");
            lbl.className = "cal-day-label";
            lbl.textContent = dl;
            grid.appendChild(lbl);
          });
          for (let i = 0; i < firstDay; i++) {
            const b = document.createElement("div");
            b.className = "cal-cell future";
            grid.appendChild(b);
          }
          for (let d = 1; d <= days; d++) {
            const cell = document.createElement("div");
            const k = dk(y, m, d);
            const isFut = isCurr && d > today.getDate();
            const isDone = !!logs[h.id]?.[k];
            const isToday = isCurr && d === today.getDate();
            cell.className =
              "cal-cell" +
              (isDone ? " done" : "") +
              (isFut ? " future" : "") +
              (isToday ? " today" : "");
            cell.textContent = d;
            if (isDone) {
              cell.style.background = h.color;
              cell.style.color = "#0f0f0f";
            }
            if (!isFut)
              cell.onclick = () => {
                if (!logs[h.id]) logs[h.id] = {};
                if (logs[h.id][k]) delete logs[h.id][k];
                else logs[h.id][k] = true;
                save();
                render();
                if (!logs[h.id]?.[k]) showToast("Unmarked ✓");
                else showToast("✓ " + h.name + " done!");
              };
            grid.appendChild(cell);
          }
          card.appendChild(grid);

          // progress
          const pw = document.createElement("div");
          pw.className = "prog-wrap";
          const pb = document.createElement("div");
          pb.className = "prog-bar";
          pb.style.width = pct + "%";
          pb.style.background = h.color;
          pw.appendChild(pb);
          card.appendChild(pw);
          list.appendChild(card);
        });
      }

      // ── Modal ─────────────────────────────────────────────────────────────────
      function openModal() {
        selEmoji = EMOJIS[0];
        selColor = COLORS[0];
        document.getElementById("mName").value = "";
        // emoji
        const er = document.getElementById("mEmoji");
        er.innerHTML = "";
        EMOJIS.forEach((e) => {
          const b = document.createElement("button");
          b.className = "e-btn" + (e === selEmoji ? " sel" : "");
          b.textContent = e;
          b.onclick = () => {
            selEmoji = e;
            er.querySelectorAll(".e-btn").forEach((x) =>
              x.classList.toggle("sel", x.textContent === e),
            );
          };
          er.appendChild(b);
        });
        // color
        const cr = document.getElementById("mColor");
        cr.innerHTML = "";
        COLORS.forEach((c) => {
          const d = document.createElement("div");
          d.className = "c-dot" + (c === selColor ? " sel" : "");
          d.style.background = c;
          d.dataset.color = c;
          d.onclick = () => {
            selColor = c;
            cr.querySelectorAll(".c-dot").forEach((x) =>
              x.classList.toggle("sel", x.dataset.color === c),
            );
          };
          cr.appendChild(d);
        });
        document.getElementById("overlay").classList.add("open");
        setTimeout(() => document.getElementById("mName").focus(), 60);
      }
      function closeModal() {
        document.getElementById("overlay").classList.remove("open");
      }
      function saveHabit() {
        const name = document.getElementById("mName").value.trim();
        if (!name) {
          document.getElementById("mName").focus();
          return;
        }
        habits.push({
          id: Date.now().toString(),
          name,
          emoji: selEmoji,
          color: selColor,
        });
        save();
        closeModal();
        render();
        showToast("🌱 Habit added!");
      }

      // ── Toast ─────────────────────────────────────────────────────────────────
      let toastTimer;
      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
      }

      // ── Month nav ─────────────────────────────────────────────────────────────
      function changeMonth(dir) {
        viewDate.setMonth(viewDate.getMonth() + dir);
        render();
      }

      // ── Export PDF ────────────────────────────────────────────────────────────
      function exportPDF() {
        showToast("Opening print dialog…");
        setTimeout(() => {
          window.print();
        }, 300);
      }

      // Show/hide print tip via beforeprint/afterprint events
      window.addEventListener("beforeprint", () => {
        document.getElementById("printTip").style.display = "block";
      });
      window.addEventListener("afterprint", () => {
        document.getElementById("printTip").style.display = "none";
      });

      // ── Keyboard ─────────────────────────────────────────────────────────────
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
        if (
          e.key === "Enter" &&
          document.getElementById("overlay").classList.contains("open")
        )
          saveHabit();
      });
      document.getElementById("overlay").onclick = (e) => {
        if (e.target === e.currentTarget) closeModal();
      };

      // ── Init ──────────────────────────────────────────────────────────────────
      applyTheme();
      render();
      loadQuote(false);
    </script>
  </body>
</html>
